name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Prepare website
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ -f site/index.html ]; then
            cp -a site/. _site/
          else
            shopt -s nullglob
            zips=(*-PAGES-READY.zip)
            if [ "${#zips[@]}" -ne 1 ]; then
              echo "::error::Upload site/ or one *-PAGES-READY.zip"; exit 1
            fi
            unzip -q "${zips[0]}" 'site/*' -d _extract
            test -f _extract/site/index.html
            cp -a _extract/site/. _site/
          fi
          touch _site/.nojekyll
          test -f _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site
      - id: deployment
        uses: actions/deploy-pages@v4
