name: Static release packages
on:
  push:
    branches: ['release/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/static_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: mesh-italia-release
          path: dist/*
          retention-days: 30
